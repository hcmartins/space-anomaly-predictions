name: martian-ch4
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26,<2.0
  - pandas>=2.1,<2.3
  - scipy>=1.11,<1.14
  - scikit-learn>=1.4,<1.6
  - matplotlib>=3.8,<3.10
  - pyyaml>=6.0,<7.0
  - pydantic>=2.5,<3.0
  - pytest>=8.0,<9.0
  - pytest-cov>=5.0,<6.0
  - joblib>=1.3,<2.0
  - tqdm>=4.66,<5.0
  - astropy>=6.0      # FITS parsing for RealEMIRSObservationProvider
  - xarray>=2024.1    # netCDF climatology loading for RealMCDClimatologyProvider
  - netcdf4>=1.6       # xarray's netCDF backend
  - requests>=2.31,<3.0  # download_emirs_sdc.py's SDC REST API client
  - openpyxl>=3.1,<4.0   # pandas .xlsx reader for the real Guha et al. MY36 documented dust-storm catalogue
  - pip
  - pip:
      - torch>=2.2,<2.5   # CPU wheel via conda-forge is version-lagged; installed via pip
