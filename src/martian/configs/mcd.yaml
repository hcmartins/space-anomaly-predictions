# Mars climatology configuration.
#
# RealMCDClimatologyProvider (data_sources/real_mcd_provider.py) is the only
# climatology provider in this pipeline. It reads a precomputed climatology
# netCDF file built by build_mcd_climatology_from_montabone.py from the
# Montabone et al. gridded column-dust-optical-depth (CDOD) climatology
# (data_cache/griddedcdod_MY{34,35,36}_v2-5.nc). It covers dust_optical_depth
# only; no real source exists for surface_temperature_k, so temperature-anomaly
# forecasting is out of scope.
#
# The MCD-proper fields below (mcd_version .. licence) are reference metadata
# reported by RealMCDClimatologyProvider.describe() when the climatology file
# carries no provenance attrs of its own.
mcd_version: "MCD v6.1 (reference metadata only; the canonical climatology is built from Montabone CDOD, not queried from the MCD)"
scenario: "climatology (average solar/EUV conditions)"
interpolation: "Linear interpolation in (Ls, local time, latitude, longitude) from the MCD's native grid"
citation: "Millour et al. (2014, 2015, 2022) — MCD v6.1; thesis reference list #79-81. Cite the MCD in any publication using it."
licence: "Free for research use. Must cite the MCD and keep the LMD/IPSL team (forget@lmd.jussieu.fr, millour@lmd.jussieu.fr) informed of usage. No commercial use."

# --- Real-provider-specific settings (RealMCDClimatologyProvider) ---
real:
  # Written by build_mcd_climatology_from_montabone.py (src/martian root).
  # RealMCDClimatologyProvider raises a clear error if it does not exist.
  climatology_netcdf_path: "data_cache/mcd/mcd_climatology_5deg.nc"
  ls_bin_deg: 30.0              # solar-longitude bin width for the precomputed grid (12 bins)
  # variables actually covered by a real source right now. Do NOT add
  # surface_temperature_k here until a real temperature climatology source
  # is found -- no such source exists today, and RealMCDClimatologyProvider
  # correctly raises a clear error if queried for it (see
  # data_sources/real_mcd_provider.py). Temperature-anomaly forecasting is
  # descoped from this pipeline as a result.
  variables: [dust_optical_depth]

  # --- Montabone et al. gridded CDOD climatology (build_mcd_climatology_from_montabone.py) ---
  # See that script's header for what this data is and how it is pooled
  # into mu_clim/sigma_clim.
  montabone:
    data_directory: "data_cache"
    mars_years: [34, 35, 36]     # real Mars Years actually downloaded; pooled together into ONE climatology (Eq. 4.1's mu_clim/sigma_clim have no mars_year dependence)
    source_variable: "cdod610"   # CDOD normalized to 610 Pa reference pressure -- the standard citable convention
    citation: "Montabone, L., Spiga, A., Kass, D. M., Kleinboehl, A., Forget, F., Millour, E., Martian Year 34 Column Dust Climatology from Mars Climate Sounder Observations: Reconstructed Maps and Model Simulations, J. Geophys. Res. - Planets (2019), doi: 10.1029/2019JE006111; Montabone et al., Eight-year Climatology of Dust Optical Depth on Mars, Icarus (2015), 251, 65-95, doi: 10.1016/j.icarus.2014.12.034."
    licence: "CC BY-SA 3.0 Unported (free to copy/redistribute/modify with attribution) -- see data_cache/*.nc files' own embedded attrs."

note: >
  No simulated climatology provider exists in this pipeline -- all values
  above describe RealMCDClimatologyProvider, the only implementation. See
  data_sources/real_mcd_provider.py.
