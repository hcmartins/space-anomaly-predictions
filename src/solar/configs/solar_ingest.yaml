# Top-level run config for `python -m solar.ingest --config configs/solar_ingest.yaml`.
#
# This file controls WHICH datasets to fetch and over WHAT date range for
# this run; the per-source specifics (URL templates, JSOC keywords, retry
# behaviour) live in configs/goes.yaml and configs/sharp.yaml and are not
# duplicated here.

# Which real data sources to ingest this run. Both are independent -- a
# failure in one does not block the other.
datasets: ["goes", "sharp"]

goes:
  # Chapter 3.3.1: Solar Cycle 24 (train) + Solar Cycle 25 (test, ongoing).
  # Start date chosen to match configs/sharp.yaml's SHARP start (SDO/HMI
  # launch, May 2010) so the two datasets overlap in time from day one --
  # GOES XRS itself goes back further (legacy GOES-13 to 2008), but there is
  # no SHARP data to pair with 2008-2010 GOES rows, so this run config does
  # not request it. End date extended from an earlier 2019-12-31 (Cycle 24
  # only) to 2025-07-24 so this range genuinely includes Cycle 25 (started
  # ~Dec 2019), per explicit researcher instruction -- see
  # planning/REAL_FULL_RANGE_RUN.md.
  start_date: "2010-05-01"
  end_date: "2025-07-24"

sharp:
  # SHARP's time_range is fully specified in configs/sharp.yaml (it also
  # controls the JSOC query directly); no per-run override here.
  enabled: true

output_root: "data_cache"
